# DIDs, die eine Vitocal nicht fuehrt. Lesen scheitert mit
# ConditionsNotCorrect (0x22), weil sie nicht in der vom Geraet gemeldeten
# DID-Liste stehen. Sie bleiben in common.yaml/datapoints.yaml erhalten, weil
# andere E3-Geraete sie sehr wohl haben.
#
# ACHTUNG: merge_config ersetzt diese Liste vollstaendig (generators/base.py:302),
# es wird nicht angehaengt. Der Eintrag 540 aus common.yaml muss deshalb hier
# wiederholt werden, sonst geht er verloren.
ignored_dids:
  - 540   # Device rejected read access
  - 535   # ObjectElectricalEnergyStatistical — Vitocharge VX3
  - 1603  # PointOfCommonCouplingPower — Vitocharge VX3
  - 1690  # ElectricalEnergySystemPhotovoltaicStatus — Vitocharge VX3
  - 1834  # ElectricalEnergyStorageStateOfEnergy — Vitocharge VX3
  - 2335  # BatteryModuleCoulombCounters — Vitocharge VX3
