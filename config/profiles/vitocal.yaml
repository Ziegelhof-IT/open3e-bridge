# Vitocal profile — heat pump specific DIDs
# Merges on top of common.yaml (vitocal entries win)
schema_version: 1

devices:
  outdoor:
    name: "Vitocal 250-A Outdoor Unit"
    model: "Vitocal 250-A"
  indoor:
    name: "Vitocal 252-A Indoor Unit"
    model: "Vitocal 252-A"
  tank:
    name: "Vitocell 100-E Hot Water Tank"
    model: "Vitocell 100-E"
  mixer:
    name: "Vitocal 252-A Heating Circuit Mixer"
    model: "Vitocal 252-A"
  heater:
    name: "Vitocal 252-A Auxiliary Heater"
    model: "Vitocal 252-A"
  energy:
    name: "Energy Management"
    model: "PV/Grid"

datapoints:
  # --- Override common devices for Vitocal-specific grouping ---
  268:
    type: "temperature_sensor"
    name: "Flow Temperature"
    device: "indoor"
    subs:
      Actual: { suffix: "current" }
      Minimum: { suffix: "min" }
      Maximum: { suffix: "max" }
      Average: { suffix: "avg" }

  269:
    type: "temperature_sensor"
    name: "Return Temperature"
    device: "indoor"
    subs:
      Actual: { suffix: "current" }
      Minimum: { suffix: "min" }
      Maximum: { suffix: "max" }
      Average: { suffix: "avg" }

  274:
    type: "temperature_sensor"
    name: "Outside Temperature"
    device: "outdoor"
    subs:
      Actual: { suffix: "current" }
      # Minimum/Maximum meldet die Anlage hier ungepflegt (Max < Min),
      # nur der Durchschnitt ist brauchbar.
      Average: { suffix: "avg" }

  318:
    type: "pressure_sensor"
    name: "Water Pressure"
    device: "indoor"
    subs:
      Actual: { suffix: "current" }
      Minimum: { suffix: "min" }
      Maximum: { suffix: "max" }
      Average: { suffix: "avg" }

  381:
    type: "pump_sensor"
    name: "Internal Pump"
    device: "indoor"
    subs:
      Actual: { suffix: "current" }

  1043:
    type: "generic_sensor"
    name: "Volume Flow"
    device: "indoor"
    icon: "mdi:water-pump"
    unit_of_measurement: "l/h"
    state_class: "measurement"
    subs:
      Actual: { suffix: "current" }

  271:
    type: "temperature_sensor"
    name: "Hot Water"
    device: "tank"
    subs:
      Actual: { suffix: "" }
      Minimum: { suffix: "min" }
      Maximum: { suffix: "max" }
      Average: { suffix: "avg" }

  396:
    type: "temperature_setpoint"
    name: "DHW Setpoint"
    device: "tank"
    min: 10
    max: 65
    step: 0.5
    writable: true
    write_mode: "write"

  # DID 535 ObjectElectricalEnergyStatistical entfernt 2026-08-02: steht nicht in
  # der vom Geraet gemeldeten DID-Liste (output/Open3Edatapoints_680.py), Lesen
  # scheitert mit ConditionsNotCorrect (0x22). Siehe .planning/phases/
  # 03-erweiterte-dids/03-DESIGN.md, Abschnitt "Korrektur 2026-08-02".

  377:
    type: "device_info"
    name: "Device Identification"
    device: "indoor"
    extract_serial: true

  875:
    type: "generic_sensor"
    name: "Legionella Protection Activation Time"
    device: "indoor"
    icon: "mdi:shield-bug"

  1710:
    type: "button_action"
    name: "DHW One-Time Charge"
    device: "tank"
    writable: true
    payload_press: "PRESS"
    command_template: >
      {% set cmd = {'mode': 'write', 'data': [[1710, 1]]} %}
      {{ cmd | to_json }}

  1006:
    type: "switch_toggle"
    name: "Quick Mode"
    device: "indoor"
    writable: true
    payload_on: "1"
    payload_off: "0"
    state_on: "1"
    state_off: "0"
    command_template: >
      {% set cmd = {'mode': 'write', 'data': [[1006, value]]} %}
      {{ cmd | to_json }}

  # --- Mixer circuit flow temperatures ---
  284:  # MixerOneCircuitFlowTemperatureSensor
    type: "temperature_sensor"
    name: "Circuit 1 Flow Temperature"
    device: "mixer"
    subs:
      Actual: { suffix: "current" }

  286:  # MixerTwoCircuitFlowTemperatureSensor
    type: "temperature_sensor"
    name: "Circuit 2 Flow Temperature"
    device: "mixer"
    subs:
      Actual: { suffix: "current" }
      Minimum: { suffix: "min" }
      Maximum: { suffix: "max" }
      Average: { suffix: "avg" }

  3016:  # HeatingBufferTemperatureSensor
    type: "temperature_sensor"
    name: "Heating Buffer Temperature"
    device: "tank"
    subs:
      Actual: { suffix: "" }
      Minimum: { suffix: "min" }
      Maximum: { suffix: "max" }
      Average: { suffix: "avg" }

  # --- Power and thermal capacity ---
  2496:  # CurrentThermalCapacitySystem (W)
    type: "power_sensor"
    name: "Thermal Power (System)"
    device: "indoor"

  2488:  # CurrentElectricalPowerConsumptionSystem
    type: "power_sensor"
    name: "Power Consumption (System)"
    device: "indoor"

  # DID 1603 PointOfCommonCouplingPower entfernt 2026-08-02: Netzverknuepfungs-
  # punkt eines Vitocharge VX3, auf dieser Anlage nicht vorhanden (0x22).

  # --- DHW Operation State + water_heater ---
  531:  # DomesticHotWaterOperationState
    type: "generic_sensor"
    name: "DHW Operation Mode"
    device: "tank"
    icon: "mdi:water-boiler"
    water_heater:
      name: "Hot Water"
      trigger_did: 531
      current_temperature_did: 271
      current_temperature_did_name: "DomesticHotWaterSensor"
      current_temperature_sub: "Actual"
      temperature_did: 396
      temperature_did_name: "DomesticHotWaterTemperatureSetpoint"
      modes: ["off", "eco", "performance"]
      mode_state_template: >
        {% set m = value | int(0) %}
        {% if m == 0 %}off{% elif m == 1 %}eco{% else %}performance{% endif %}
      mode_command_template: >
        {% set values = {'off': '0000', 'eco': '0100', 'performance': '0200'} %}
        {% set cmd = {'mode': 'write-raw', 'data': [[531, values[value]]]} %}
        {{ cmd | to_json }}
      temperature_command_template: >
        {% set cmd = {'mode': 'write', 'data': [[396, value | float]]} %}
        {{ cmd | to_json }}
      min_temp: 10
      max_temp: 60
      precision: 0.5
      temperature_unit: "C"

  # --- Heat pump specific ---
  2442:  # HeatPumpFrostProtection
    type: "binary_onoff"
    name: "Heat Pump Frost Protection"
    device: "outdoor"
    payload_off: "0"
    payload_on: "1"
    # BIN-01: Dieser DID wird als Float publiziert ("0.0"/"1.0"). Ohne
    # Normalisierung matcht der Rohwert weder payload_on noch payload_off,
    # und die Entity bleibt in HA dauerhaft 'unknown'.
    value_template: "{{ 1 if (value | float(0)) > 0.5 else 0 }}"

  401:  # MixerOneCircuitPump
    type: "binary_onoff"
    name: "Circuit 1 Pump"
    device: "mixer"
    icon: "mdi:pump"
    payload_off: "0"
    payload_on: "1"
    trigger_sub: "PowerState"

  402:  # MixerTwoCircuitPump
    type: "binary_onoff"
    name: "Circuit 2 Pump"
    device: "mixer"
    icon: "mdi:pump"
    payload_off: "0"
    payload_on: "1"
    trigger_sub: "PowerState"

  # Umkehrventil des Kaeltekreises — schaltet zwischen Heizen und Abtauen bzw.
  # Kuehlen. Nicht zu verwechseln mit dem hydraulischen 4/3-Wegeventil (DID 2735),
  # das die Waerme auf Puffer/Heizkreis/Warmwasser verteilt.
  # Upstream sind beide nur O3EByteVal ohne dokumentierte Enum-Bedeutung; deshalb
  # bewusst kein value_template. Die Zuordnung der Zahlenwerte laesst sich erst
  # ueber einen beobachteten Abtauzyklus belegen.
  1773:  # RefrigerantCircuitFourWayValve
    type: "generic_sensor"
    name: "Refrigerant Reversing Valve"
    device: "outdoor"
    icon: "mdi:valve"

  3190:  # RefrigerantCircuitFourWayValvePosition
    type: "generic_sensor"
    name: "Refrigerant Reversing Valve Position"
    device: "outdoor"
    icon: "mdi:valve"

  1775:  # PrimaryCircuitFanOne
    type: "pump_sensor"
    name: "Primary Circuit Fan 1"
    device: "outdoor"

  1776:  # PrimaryCircuitFanTwo
    type: "pump_sensor"
    name: "Primary Circuit Fan 2"
    device: "outdoor"

  # --- Writable number (safety validated) ---
  2626:  # MaximumPowerElectricalHeater (W)
    type: "power_sensor"
    name: "Max Power Electric Heater"
    device: "heater"
    writable: true
    min: 0
    max: 8000
    step: 100
    command_template: >
      {% set intvalue = value | int %}
      {% if intvalue > 0 and intvalue < 4000 %}
      {% else %}
      {% set cmddata = '%02x' % (intvalue % 256) + '%02x' % (intvalue // 256) + '0000' %}
      {% set cmd = {'mode': 'write-raw', 'data': [[2626, cmddata]]} %}
      {{ cmd | to_json }}
      {% endif %}

  # --- Binary sensors ---
  2855:
    type: "binary_onoff"
    name: "Circuit 1 Frost Protection"
    device: "mixer"
    payload_off: "0"
    payload_on: "1"
    trigger_sub: "State"

  2856:
    type: "binary_onoff"
    name: "Circuit 2 Frost Protection"
    device: "mixer"
    payload_off: "0"
    payload_on: "1"
    trigger_sub: "State"

  2351:  # HeatPumpCompressor
    type: "binary_onoff"
    name: "Compressor Status"
    device: "outdoor"
    payload_off: "0"
    payload_on: "1"
    trigger_sub: "PowerState"

  2352:  # AdditionalElectricHeater
    type: "binary_onoff"
    name: "Additional Heater Status"
    device: "heater"
    payload_off: "0"
    payload_on: "1"
    trigger_sub: "PowerState"

  # --- Statistics ---
  2369:  # HeatPumpCompressorStatistical
    type: "generic_sensor"
    name: "Compressor Statistics"
    device: "outdoor"
    subs:
      hours:
        unit_of_measurement: "h"
        icon: "mdi:clock-outline"
        state_class: "total_increasing"
      starts:
        icon: "mdi:counter"
        state_class: "total_increasing"

  2370:  # AdditionalElectricHeaterStatistical
    type: "generic_sensor"
    name: "Additional Heater Statistics"
    device: "heater"
    subs:
      hours:
        unit_of_measurement: "h"
        icon: "mdi:clock-outline"
        state_class: "total_increasing"
      starts:
        icon: "mdi:counter"
        state_class: "total_increasing"

  # --- Temperature sensors ---
  1770:  # SecondaryOutletTemperatureSensor
    type: "temperature_sensor"
    name: "Secondary Circuit Supply Temperature"
    device: "indoor"
    subs:
      Actual: { suffix: "current" }

  1771:  # EngineRoomTemperatureSensor
    type: "temperature_sensor"
    name: "Boiler Room Temperature"
    device: "indoor"
    subs:
      Actual: { suffix: "current" }

  2333:  # EconomizerLiquidTemperatureSensor
    type: "temperature_sensor"
    name: "Condenser Liquid Temperature"
    device: "indoor"
    subs:
      Actual: { suffix: "current" }

  2334:  # EvaporatorVaporTemperatureSensor
    type: "temperature_sensor"
    name: "Evaporator Vapor Temperature"
    device: "outdoor"
    subs:
      Actual: { suffix: "current" }

  354:  # PrimaryHeatExchanger
    type: "temperature_sensor"
    name: "Primary Heat Exchanger Temperature"
    device: "indoor"
    subs:
      Actual: { suffix: "current" }

  # --- Status DIDs ---
  2350:  # EnergyManagmentSystemResultingControlState
    type: "generic_sensor"
    name: "Smart Grid Operating State"
    device: "indoor"
    icon: "mdi:home-variant"
    value_template: >
      {% set ostate = int(value) %}
      {% if ostate==1 %}
        {{ "Shutdown" }}
      {% elif ostate==2 %}
        {{ "Normal operation" }}
      {% elif ostate==3 %}
        {{ "Preferred operation" }}
      {% elif ostate==4 %}
        {{ "Forced operation" }}
      {% else %}
        {{ value }}
      {% endif %}

  # DID 2335 entfernt 2026-08-02. Der Eintrag war als "FourWayValve" gefuehrt, das
  # war ein Zahlendreher: gemeint ist 2735. 2335 ist upstream
  # RawCodec(8, "BatteryModuleCoulombCounters") und auf dieser Anlage nicht
  # vorhanden (0x22). Die Enum-Uebersetzung ist nach 2735 gewandert.

  2346:  # CompressorSpeed (%)
    type: "pump_sensor"
    name: "Compressor Speed"
    device: "outdoor"

  2569:  # CompressorSpeedRPS
    type: "generic_sensor"
    name: "Compressor Speed (rps)"
    device: "outdoor"
    unit_of_measurement: "rps"
    state_class: "measurement"

  # --- PV ---
  # DIDs 1690 (ElectricalEnergySystemPhotovoltaicStatus) und 1834
  # (ElectricalEnergyStorageStateOfEnergy) entfernt 2026-08-02: beide stehen in
  # Open3EdatapointsVx3.py, gehoeren also zum Vitocharge VX3 und nicht zur
  # Vitocal. Ohne Viessmann-Batteriespeicher am E3-Bus antwortet die ECU mit
  # ConditionsNotCorrect (0x22). PV-Daten kommen in dieser Installation aus dem
  # Wechselrichter direkt, nicht ueber den E3-Bus.

  # --- Room temperature setpoints (writable) ---
  # DID 424/426: O3EComplexType(9) — Comfort(2,s=10) + Standard(2,s=10) + Reduced(2,s=10) + Increased(2,s=10) + Duration(1)
  # Each sub writes the full 9 bytes, reading siblings from HA state
  424:  # MixerOneCircuitRoomTemperatureSetpoint
    type: "temperature_setpoint"
    name: "Circuit 1 Room Setpoint"
    device: "mixer"
    subs:
      Comfort:
        suffix: ""
        entity_type: "number"
        writable: true
        min: 3
        max: 37
        step: 0.5
        unit_of_measurement: "°C"
        icon: "mdi:thermometer-plus"
        mode: "slider"
        command_template: >
          {% set com = (value | float * 10) | int %}
          {% set sta = (states('number.open3e_680_424_standard') | float(20) * 10) | int %}
          {% set red = (states('number.open3e_680_424_reduced') | float(16) * 10) | int %}
          {% set cmddata = '%02x' | format(com % 256) + '%02x' | format(com // 256) + '%02x' | format(sta % 256) + '%02x' | format(sta // 256) + '%02x' | format(red % 256) + '%02x' | format(red // 256) + '000000' %}
          {% set cmd = {'mode': 'write-raw', 'data': [[424, cmddata]]} %}
          {{ cmd | to_json }}
      Standard:
        suffix: ""
        entity_type: "number"
        writable: true
        min: 3
        max: 37
        step: 0.5
        unit_of_measurement: "°C"
        icon: "mdi:thermometer"
        mode: "slider"
        command_template: >
          {% set com = (states('number.open3e_680_424_comfort') | float(22) * 10) | int %}
          {% set sta = (value | float * 10) | int %}
          {% set red = (states('number.open3e_680_424_reduced') | float(16) * 10) | int %}
          {% set cmddata = '%02x' | format(com % 256) + '%02x' | format(com // 256) + '%02x' | format(sta % 256) + '%02x' | format(sta // 256) + '%02x' | format(red % 256) + '%02x' | format(red // 256) + '000000' %}
          {% set cmd = {'mode': 'write-raw', 'data': [[424, cmddata]]} %}
          {{ cmd | to_json }}
      Reduced:
        suffix: ""
        entity_type: "number"
        writable: true
        min: 3
        max: 37
        step: 0.5
        unit_of_measurement: "°C"
        icon: "mdi:thermometer-minus"
        mode: "slider"
        command_template: >
          {% set com = (states('number.open3e_680_424_comfort') | float(22) * 10) | int %}
          {% set sta = (states('number.open3e_680_424_standard') | float(20) * 10) | int %}
          {% set red = (value | float * 10) | int %}
          {% set cmddata = '%02x' | format(com % 256) + '%02x' | format(com // 256) + '%02x' | format(sta % 256) + '%02x' | format(sta // 256) + '%02x' | format(red % 256) + '%02x' | format(red // 256) + '000000' %}
          {% set cmd = {'mode': 'write-raw', 'data': [[424, cmddata]]} %}
          {{ cmd | to_json }}

  426:  # MixerTwoCircuitRoomTemperatureSetpoint
    type: "temperature_setpoint"
    name: "Circuit 2 Room Setpoint"
    device: "mixer"
    subs:
      Comfort:
        suffix: ""
        entity_type: "number"
        writable: true
        min: 3
        max: 37
        step: 0.5
        unit_of_measurement: "°C"
        icon: "mdi:thermometer-plus"
        mode: "slider"
        command_template: >
          {% set com = (value | float * 10) | int %}
          {% set sta = (states('number.open3e_680_426_standard') | float(20) * 10) | int %}
          {% set red = (states('number.open3e_680_426_reduced') | float(16) * 10) | int %}
          {% set cmddata = '%02x' | format(com % 256) + '%02x' | format(com // 256) + '%02x' | format(sta % 256) + '%02x' | format(sta // 256) + '%02x' | format(red % 256) + '%02x' | format(red // 256) + '000000' %}
          {% set cmd = {'mode': 'write-raw', 'data': [[426, cmddata]]} %}
          {{ cmd | to_json }}
      Standard:
        suffix: ""
        entity_type: "number"
        writable: true
        min: 3
        max: 37
        step: 0.5
        unit_of_measurement: "°C"
        icon: "mdi:thermometer"
        mode: "slider"
        command_template: >
          {% set com = (states('number.open3e_680_426_comfort') | float(22) * 10) | int %}
          {% set sta = (value | float * 10) | int %}
          {% set red = (states('number.open3e_680_426_reduced') | float(16) * 10) | int %}
          {% set cmddata = '%02x' | format(com % 256) + '%02x' | format(com // 256) + '%02x' | format(sta % 256) + '%02x' | format(sta // 256) + '%02x' | format(red % 256) + '%02x' | format(red // 256) + '000000' %}
          {% set cmd = {'mode': 'write-raw', 'data': [[426, cmddata]]} %}
          {{ cmd | to_json }}
      Reduced:
        suffix: ""
        entity_type: "number"
        writable: true
        min: 3
        max: 37
        step: 0.5
        unit_of_measurement: "°C"
        icon: "mdi:thermometer-minus"
        mode: "slider"
        command_template: >
          {% set com = (states('number.open3e_680_426_comfort') | float(22) * 10) | int %}
          {% set sta = (states('number.open3e_680_426_standard') | float(20) * 10) | int %}
          {% set red = (value | float * 10) | int %}
          {% set cmddata = '%02x' | format(com % 256) + '%02x' | format(com // 256) + '%02x' | format(sta % 256) + '%02x' | format(sta // 256) + '%02x' | format(red % 256) + '%02x' | format(red // 256) + '000000' %}
          {% set cmd = {'mode': 'write-raw', 'data': [[426, cmddata]]} %}
          {{ cmd | to_json }}

  # --- Heating circuit operation modes (extended for heat pumps) ---
  # OpModes: 0=Off, 1=Heating, 5=Cooling, 255=Automatic
  # NEEDS-VERIFY: Cooling mode (5) untested on Vitocal 250-A hardware
  1415:  # MixerOneCircuitOperationState
    type: "select_mode"
    name: "Circuit 1 Operation Mode"
    device: "mixer"
    subs:
      Mode/ID:
        entity_type: "select"
        options: ["off", "heat", "cool", "auto"]
        value_template: >
          {% set m = value | int(0) %}
          {% if m == 0 %}off{% elif m == 1 %}heat{% elif m == 5 %}cool{% elif m == 255 %}auto{% else %}auto{% endif %}
        command_template: >
          {% set values = {'off':'0000', 'heat':'0100', 'cool':'0500', 'auto':'ff00'} %}
          {% set cmd = {'mode': 'write-raw', 'data':[[1415, values[value]]]} %}
          {{ cmd | to_json }}
    climate:
      name: "Heating Circuit 1"
      trigger_sub: "Mode/ID"
      modes: ["off", "heat", "cool", "auto"]
      mode_state_template: >
        {% set m = value_json | int(0) %}
        {% if m == 0 %}off{% elif m == 1 %}heat{% elif m == 5 %}cool{% elif m == 255 %}auto{% else %}auto{% endif %}
      mode_command_template: >
        {% set values = {'off':'0000', 'heat':'0100', 'cool':'0500', 'auto':'ff00'} %}
        {% set cmd = {'mode': 'write-raw', 'data':[[1415, values[value]]]} %}
        {{ cmd | to_json }}
      temperature_did: 1643
      temperature_did_name: "MixerOneCircuitCurrentTemperatureSetpoint"
      min_temp: 3
      max_temp: 37
      precision: 1.0
      temperature_unit: "C"
      temperature_command_template: >
        {% set value_target = (value*10) | int %}
        {% set hk1_bp = states('sensor.1415_mixeronecircuitoperationstate') %}
        {% if (hk1_bp=="Komfort") %}
        {% set value_com = min(max(30, value_target),370) %}
        {% set value_sta = min(max(30, value_target-20),370) %}
        {% set value_red = min(max(30, value_target-40),370) %}
        {% elif (hk1_bp=="Reduziert") or (hk1_bp=="Frostschutz") or (hk1_bp=="Abschaltbetrieb") %}
        {% set value_com = min(max(30, value_target+40),370) %}
        {% set value_sta = min(max(30, value_target+20),370) %}
        {% set value_red = min(max(30, value_target),370) %}
        {% else %}
        {% set value_com = min(max(30, value_target+20),370) %}
        {% set value_sta = min(max(30, value_target),370) %}
        {% set value_red = min(max(30, value_target-20),370) %}
        {% endif %}
        {% set cmddata = '%02x' % (value_com % 256) + '%02x' % (value_com // 256) + '%02x' % (value_sta % 256) + '%02x' % (value_sta // 256) + '%02x' % (value_red % 256) + '%02x' % (value_red // 256) + '000000' %}
        {% set cmd = {'mode': 'write-raw', 'data':[[424, cmddata]]} %}
        {{ cmd | to_json }}

  1416:  # MixerTwoCircuitOperationState
    type: "select_mode"
    name: "Circuit 2 Operation Mode"
    device: "mixer"
    subs:
      Mode/ID:
        entity_type: "select"
        options: ["off", "heat", "cool", "auto"]
        value_template: >
          {% set m = value | int(0) %}
          {% if m == 0 %}off{% elif m == 1 %}heat{% elif m == 5 %}cool{% elif m == 255 %}auto{% else %}auto{% endif %}
        command_template: >
          {% set values = {'off':'0000', 'heat':'0100', 'cool':'0500', 'auto':'ff00'} %}
          {% set cmd = {'mode': 'write-raw', 'data':[[1416, values[value]]]} %}
          {{ cmd | to_json }}
    climate:
      name: "Heating Circuit 2"
      trigger_sub: "Mode/ID"
      modes: ["off", "heat", "cool", "auto"]
      mode_state_template: >
        {% set m = value_json | int(0) %}
        {% if m == 0 %}off{% elif m == 1 %}heat{% elif m == 5 %}cool{% elif m == 255 %}auto{% else %}auto{% endif %}
      mode_command_template: >
        {% set values = {'off':'0000', 'heat':'0100', 'cool':'0500', 'auto':'ff00'} %}
        {% set cmd = {'mode': 'write-raw', 'data':[[1416, values[value]]]} %}
        {{ cmd | to_json }}
      temperature_did: 1644
      temperature_did_name: "MixerTwoCircuitCurrentTemperatureSetpoint"
      min_temp: 3
      max_temp: 37
      precision: 1.0
      temperature_unit: "C"
      temperature_command_template: >
        {% set value_target = (value*10) | int %}
        {% set hk2_bp = states('sensor.1416_mixertwocircuitoperationstate') %}
        {% if (hk2_bp=="Komfort") %}
        {% set value_com = min(max(30, value_target),370) %}
        {% set value_sta = min(max(30, value_target-20),370) %}
        {% set value_red = min(max(30, value_target-40),370) %}
        {% elif (hk2_bp=="Reduziert") or (hk2_bp=="Frostschutz") or (hk2_bp=="Abschaltbetrieb") %}
        {% set value_com = min(max(30, value_target+40),370) %}
        {% set value_sta = min(max(30, value_target+20),370) %}
        {% set value_red = min(max(30, value_target),370) %}
        {% else %}
        {% set value_com = min(max(30, value_target+20),370) %}
        {% set value_sta = min(max(30, value_target),370) %}
        {% set value_red = min(max(30, value_target-20),370) %}
        {% endif %}
        {% set cmddata = '%02x' % (value_com % 256) + '%02x' % (value_com // 256) + '%02x' % (value_sta % 256) + '%02x' % (value_sta // 256) + '%02x' % (value_red % 256) + '%02x' % (value_red // 256) + '000000' %}
        {% set cmd = {'mode': 'write-raw', 'data':[[426, cmddata]]} %}
        {{ cmd | to_json }}

  # --- Heating curve (writable) ---
  # DID 880/881: O3EComplexType(4) — Gradient(1, scale=10) + Level(1, signed) + BasePoint(2, signed, scale=10)
  # Writing confirmed: open3e O3EComplexType.encode() supports full DID write
  880:  # MixerOneCircuitCentralHeatingCurve
    type: "generic_sensor"
    name: "Heating Curve Circuit 1"
    device: "mixer"
    icon: "mdi:chart-bell-curve-cumulative"
    subs:
      Gradient:
        suffix: "gradient"
        entity_type: "number"
        writable: true
        min: 0.1
        max: 3.5
        step: 0.1
        icon: "mdi:slope-uphill"
        unit_of_measurement: ""
        mode: "slider"
        command_template: >
          {% set grad = (value | float * 10) | int %}
          {% set lvl = states('number.open3e_680_880_level') | float(0) | int %}
          {% set lvl_b = lvl if lvl >= 0 else 256 + lvl %}
          {% set cmddata = '%02x' | format(grad) + '%02x' | format(lvl_b) + '0000' %}
          {% set cmd = {'mode': 'write-raw', 'data': [[880, cmddata]]} %}
          {{ cmd | to_json }}
      Level:
        suffix: "level"
        entity_type: "number"
        writable: true
        min: -15
        max: 40
        step: 1
        icon: "mdi:arrow-up-down"
        unit_of_measurement: "K"
        mode: "slider"
        command_template: >
          {% set grad = (states('number.open3e_680_880_gradient') | float(0.8) * 10) | int %}
          {% set lvl = value | int %}
          {% set lvl_b = lvl if lvl >= 0 else 256 + lvl %}
          {% set cmddata = '%02x' | format(grad) + '%02x' | format(lvl_b) + '0000' %}
          {% set cmd = {'mode': 'write-raw', 'data': [[880, cmddata]]} %}
          {{ cmd | to_json }}

